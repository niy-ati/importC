name: Test the #21891 union-compat fix

on:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: niy-ati/dmd
          ref: fix-21891-union-compat-v2
          path: dmd-src

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: dmd-latest

      - name: Build patched dmd from source
        shell: bash
        run: |
          cd dmd-src
          make -j$(nproc) MODEL=64 HOST_DMD=dmd ENABLE_RELEASE=1 ENABLE_ASSERTS=1 dmd

      - name: Case 1 - sljit's real union scenario, should now succeed
        shell: bash
        run: |
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          IMPORTC_INC=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/druntime/src")
          mkdir -p case1 && cd case1
          cat > main_union.c << 'EOF'
          union executable_code {
              void* code;
              long (*func)(long a);
          };
          EOF
          cat > test_union.c << 'EOF'
          union executable_code {
              void* code;
              long (*func0)(void);
              long (*func1)(long a);
              long (*func2)(long a, long b);
              long (*func3)(long a, long b, long c);
          };
          EOF
          "$DMD" -m64 -I"$IMPORTC_INC" -c main_union.c test_union.c
          echo "case1 exit=$?  (expect 0 - same size/alignment, should now compile)"

      - name: Case 2 - genuinely different union size, must still error
        shell: bash
        continue-on-error: true
        run: |
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          IMPORTC_INC=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/druntime/src")
          mkdir -p case2 && cd case2
          cat > a.c << 'EOF'
          union U { int x; };
          EOF
          cat > b.c << 'EOF'
          union U { long long x; };
          EOF
          "$DMD" -m64 -I"$IMPORTC_INC" -c a.c b.c
          echo "case2 exit=$?  (expect nonzero - different size, must still error)"

      - name: Case 3 - struct, same size+alignment but different field type, must still error
        shell: bash
        continue-on-error: true
        run: |
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          IMPORTC_INC=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/druntime/src")
          mkdir -p case3 && cd case3
          cat > a.c << 'EOF'
          struct S { long long a; };
          EOF
          cat > b.c << 'EOF'
          struct S { void* a; };
          EOF
          "$DMD" -m64 -I"$IMPORTC_INC" -c a.c b.c
          echo "case3 exit=$?  (expect nonzero - structs unaffected, field type must still match)"

      - name: Case 4 - the real, actual sljitMain.c + sljitTest.c, unmodified upstream
        shell: bash
        continue-on-error: true
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          IMPORTC_INC=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/druntime/src")
          mkdir -p case4 && cd case4
          curl -sL "https://github.com/zherczeg/sljit/archive/39c508d1b8fbae332d60c7450db20236913089da.tar.gz" -o sljit.tar.gz
          tar xzf sljit.tar.gz
          SLJIT_DIR=sljit-39c508d1b8fbae332d60c7450db20236913089da
          cp -r "$SLJIT_DIR/sljit_src" sljit_src
          cp -r "$SLJIT_DIR/test_src" sljit_test
          cat > importc_msvc_builtins.h << 'EOF'
          unsigned __arch_inverted(void);
          unsigned __arch_avx10ver(void);
          volatile void *RtlSetVolatileMemory(volatile void *Destination, int Fill, unsigned long long Length);
          EOF
          cat > msvc_intrinsic_shims.c << 'EOF'
          unsigned __arch_inverted(void) { return 0xFFFFFFFFu; }
          unsigned __arch_avx10ver(void) { return 0; }
          volatile void *RtlSetVolatileMemory(volatile void *Destination, int Fill, unsigned long long Length)
          {
              volatile unsigned char *p = (volatile unsigned char *)Destination;
              unsigned long long i;
              for (i = 0; i < Length; i++) p[i] = (unsigned char)Fill;
              return Destination;
          }
          EOF
          "$DMD" -m64 -allinst -P=/FIimportc_msvc_builtins.h -P=/I. -P=/Isljit_src -P=/Isljit_test -P=-DWIN32_LEAN_AND_MEAN -P=-DSLJIT_HAVE_CONFIG_PRE=1 -I"$IMPORTC_INC" -Isljit_src -Isljit_test -c sljit_src/sljitLir.c sljit_test/sljitMain.c sljit_test/sljitTest.c msvc_intrinsic_shims.c
          echo "case4 exit=$?  (expect 0 - the real, unmodified upstream files, should now compile together)"

      - name: Case 5 - run the actual regression test through dmd's own real test runner
        shell: bash
        run: |
          DMDBIN=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          cd dmd-src
          make -j$(nproc) -C druntime MODEL=64 OS=windows BUILD=release DMD="$DMDBIN"
          mkdir -p ../phobos
          curl -sL "https://github.com/dlang/phobos/archive/master.tar.gz" -o ../phobos.tar.gz
          tar xzf ../phobos.tar.gz -C ../phobos --strip-components=1
          make -j$(nproc) -C ../phobos MODEL=64 OS=windows BUILD=release DMD_DIR=../dmd-src DMD="$DMDBIN"
          LIBDIR=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64")
          PHOBOSLIBDIR=$(cygpath -w "$GITHUB_WORKSPACE/phobos/generated/windows/release/64")
          "$DMDBIN" -g -i -Icompiler/test -I../phobos -Idruntime/import -release compiler/test/run.d -ofgenerated/run -L/LIBPATH:"$LIBDIR" -L/LIBPATH:"$PHOBOSLIBDIR" -defaultlib=phobos64
          generated/run -j1 --environment MODEL=64 HOST_DMD="$DMDBIN" runnable/test21891.d
          echo "case5 exit=$?  (expect 0 - the actual regression test for #21891 passes under dmd's own test runner)"

      - name: Case 6 - confirm the fail_compilation test passes with the hand-written TEST_OUTPUT
        shell: bash
        run: |
          DMDBIN=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          cd dmd-src
          generated/run -j1 --environment MODEL=64 HOST_DMD="$DMDBIN" fail_compilation/test21891.d
          echo "case6 exit=$?  (expect 0 - the fail_compilation test passes with the corrected TEST_OUTPUT)"
