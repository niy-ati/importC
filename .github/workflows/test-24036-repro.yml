name: Reproduce #24036 unresolved RTInfoImpl

on:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: mergebase-anchor
            dmd_ref: 400f45d2fe780328d69e2999d0fca27d9c9893ff
            phobos_ref: master
          - label: bisect2-1
            dmd_ref: b17064ff5289cc43f8ec01ac58cf236caecfe7a5
            phobos_ref: master
          - label: bisect2-2
            dmd_ref: 5677415103984205af0c43da9ab11f2ada106e27
            phobos_ref: master
          - label: bisect2-3
            dmd_ref: 6432bdb923fa049fe4391acc5dc5cbead898b94d
            phobos_ref: master
          - label: bisect2-4
            dmd_ref: 3aa585f0f39de6459fe799c7cd8b592f22a74cea
            phobos_ref: master
          - label: bisect2-5
            dmd_ref: b25cf3f03e8fe77f7cccfee073b1e3412ea771e7
            phobos_ref: master
          - label: bisect2-6
            dmd_ref: f363762eaf231230309b10084e5aaf0d6d4e8523
            phobos_ref: master
          - label: bisect2-7
            dmd_ref: 09e2c73a0b604911b1d64ca0c4de644706dfc750
            phobos_ref: master
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dlang/dmd
          ref: ${{ matrix.dmd_ref }}
          path: dmd

      - uses: actions/checkout@v4
        with:
          repository: dlang/phobos
          ref: ${{ matrix.phobos_ref }}
          path: phobos

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: dmd-latest

      - name: Build dmd, druntime and phobos from ${{ matrix.label }} (${{ matrix.dmd_ref }})
        shell: bash
        run: |
          cd dmd
          make -j$(nproc) MODEL=64 HOST_DMD=dmd ENABLE_RELEASE=1 ENABLE_ASSERTS=1 dmd
          DMDBIN=$(cygpath -w "$GITHUB_WORKSPACE/dmd/generated/windows/release/64/dmd.exe")
          make -j$(nproc) -C druntime MODEL=64 OS=windows BUILD=release DMD="$DMDBIN"
          make -j$(nproc) -C ../phobos MODEL=64 OS=windows BUILD=release DMD="$DMDBIN"

      - name: Reproduce the exact issue #24036 repro steps (${{ matrix.label }})
        shell: bash
        run: |
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd/generated/windows/release/64/dmd.exe")
          IMPORTC_INC=$(cygpath -w "$GITHUB_WORKSPACE/dmd/druntime/src")
          LIBDIR=$(cygpath -w "$GITHUB_WORKSPACE/dmd/generated/windows/release/64")
          PHOBOSLIBDIR=$(cygpath -w "$GITHUB_WORKSPACE/phobos/generated/windows/release/64")
          mkdir -p repro && cd repro
          cat > a.h << 'EOF'
          typedef struct {
              int* a;
              int* b;
              int* c;
              int* d;
              int e;
              int f;
              int g;
          } MyStruct;
          EOF
          cat > b.d << 'EOF'
          module b;
          import a;
          void main() {
              MyStruct[] arr;
              MyStruct s = {};
              arr ~= s;
          }
          EOF
          "$DMD" -m64 -I"$IMPORTC_INC" -I. -L/LIBPATH:"$LIBDIR" -L/LIBPATH:"$PHOBOSLIBDIR" -defaultlib=phobos64 b.d
          echo "repro exit=$?  (${{ matrix.label }}: 0 = bug NOT present, nonzero = bug reproduces)"
