name: Reproduce #24036 unresolved RTInfoImpl

on:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dlang/dmd
          ref: master
          path: dmd-src

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: dmd-latest

      - name: Build dmd from upstream master
        shell: bash
        run: |
          cd dmd-src
          make -j$(nproc) MODEL=64 HOST_DMD=dmd ENABLE_RELEASE=1 ENABLE_ASSERTS=1 dmd

      - name: Reproduce the exact issue #24036 repro steps
        shell: bash
        run: |
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          IMPORTC_INC=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/druntime/src")
          mkdir -p repro && cd repro
          cat > a.h << 'EOF'
          typedef struct {
              int* a;
              int* b;
              int* c;
              int* d;
              int e;
              int f;
              int g;
          } MyStruct;
          EOF
          cat > b.d << 'EOF'
          module b;
          import a;
          void main() {
              MyStruct[] arr;
              MyStruct s = {};
              arr ~= s;
          }
          EOF
          "$DMD" -m64 -I"$IMPORTC_INC" -I. b.d
          echo "repro exit=$?  (0 = bug NOT present / already fixed, nonzero = bug still reproduces)"
