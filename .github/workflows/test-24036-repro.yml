name: Reproduce #24036 unresolved RTInfoImpl

on:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: v2.113.0-anchor
            dmd_ref: v2.113.0
            phobos_ref: v2.113.0
          - label: bisect-1
            dmd_ref: 76801663fa4718840b0425555ff6d0e55fa74abb
            phobos_ref: master
          - label: bisect-2
            dmd_ref: 37fa185e625d389f9d1598abb8b2d09d315793a9
            phobos_ref: master
          - label: bisect-3
            dmd_ref: 4d437b3748b7a67ded3ffce379ca7fa26be9b0c2
            phobos_ref: master
          - label: bisect-4
            dmd_ref: 4264da7e861b196efee92696ec8f93cf1893f8cb
            phobos_ref: master
          - label: bisect-5
            dmd_ref: 68a5bb352081481bb3a729de6977afe51db58076
            phobos_ref: master
          - label: bisect-6
            dmd_ref: 8187392804f9c69261fa012657484562169e1aea
            phobos_ref: master
          - label: bisect-7
            dmd_ref: abb0daeb775896b4546dafae72519be47dc75e64
            phobos_ref: master
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dlang/dmd
          ref: ${{ matrix.dmd_ref }}
          path: dmd

      - uses: actions/checkout@v4
        with:
          repository: dlang/phobos
          ref: ${{ matrix.phobos_ref }}
          path: phobos

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: dmd-latest

      - name: Build dmd, druntime and phobos from ${{ matrix.label }} (${{ matrix.dmd_ref }})
        shell: bash
        run: |
          cd dmd
          make -j$(nproc) MODEL=64 HOST_DMD=dmd ENABLE_RELEASE=1 ENABLE_ASSERTS=1 dmd
          DMDBIN=$(cygpath -w "$GITHUB_WORKSPACE/dmd/generated/windows/release/64/dmd.exe")
          make -j$(nproc) -C druntime MODEL=64 OS=windows BUILD=release DMD="$DMDBIN"
          make -j$(nproc) -C ../phobos MODEL=64 OS=windows BUILD=release DMD="$DMDBIN"

      - name: Reproduce the exact issue #24036 repro steps (${{ matrix.label }})
        shell: bash
        run: |
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd/generated/windows/release/64/dmd.exe")
          IMPORTC_INC=$(cygpath -w "$GITHUB_WORKSPACE/dmd/druntime/src")
          LIBDIR=$(cygpath -w "$GITHUB_WORKSPACE/dmd/generated/windows/release/64")
          PHOBOSLIBDIR=$(cygpath -w "$GITHUB_WORKSPACE/phobos/generated/windows/release/64")
          mkdir -p repro && cd repro
          cat > a.h << 'EOF'
          typedef struct {
              int* a;
              int* b;
              int* c;
              int* d;
              int e;
              int f;
              int g;
          } MyStruct;
          EOF
          cat > b.d << 'EOF'
          module b;
          import a;
          void main() {
              MyStruct[] arr;
              MyStruct s = {};
              arr ~= s;
          }
          EOF
          "$DMD" -m64 -I"$IMPORTC_INC" -I. -L/LIBPATH:"$LIBDIR" -L/LIBPATH:"$PHOBOSLIBDIR" -defaultlib=phobos64 b.d
          echo "repro exit=$?  (${{ matrix.label }}: 0 = bug NOT present, nonzero = bug reproduces)"
