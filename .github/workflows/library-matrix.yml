# Milestone 1: smoke-test matrix for the five target libraries, through
# ImportC, on Linux and Windows. Reports pass/fail per library. sqlite is
# expected to fail here (Milestone 2 blocker, see importc-sqlite/README.md)
# and is kept in the matrix on purpose so that stays visible, not hidden.
name: Library matrix

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare D compiler
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: dmd-master

      - name: Install system library dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev zlib1g-dev libsqlite3-dev

      - name: sljit (expected to fail on Linux - see sljit README, GNU asm CPU detection not supported by ImportC yet)
        id: sljit
        continue-on-error: true
        working-directory: importc-sljit/examples/add
        run: dub run

      - name: zlib
        id: zlib
        continue-on-error: true
        working-directory: importc-zlib/examples/roundtrip
        run: dub run

      - name: curl
        id: curl
        continue-on-error: true
        working-directory: importc-curl/examples/version_check
        run: dub run

      - name: sqlite (expected to fail - Milestone 2 blocker)
        id: sqlite
        continue-on-error: true
        working-directory: importc-sqlite
        run: dmd -m64 -c -P=-DSQLITE_DISABLE_INTRINSIC sqlite_src/sqlite3.c

      - name: Summary
        if: always()
        run: |
          echo "sljit:  ${{ steps.sljit.outcome }} (expected failure - Windows only for now)"
          echo "zlib:   ${{ steps.zlib.outcome }}"
          echo "curl:   ${{ steps.curl.outcome }}"
          echo "sqlite: ${{ steps.sqlite.outcome }} (expected failure)"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare D compiler
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: dmd-master

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install curl via vcpkg
        shell: bash
        run: C:/vcpkg/vcpkg.exe install curl:x64-windows
        # Two different vcpkg installs exist on these runners: VS's own
        # bundled copy (whose root $env:VCPKG_ROOT points at) and this
        # separate standalone one at C:\vcpkg. Using the explicit path for
        # both install and lookup keeps them talking about the same one.

      - name: Point INCLUDE/LIB at vcpkg's installed curl
        shell: pwsh
        run: |
          $installed = "C:\vcpkg\installed\x64-windows"
          echo "INCLUDE=$installed\include;$env:INCLUDE" >> $env:GITHUB_ENV
          echo "LIB=$installed\lib;$env:LIB" >> $env:GITHUB_ENV
          # dmd constructs its own explicit /LIBPATH list for the linker
          # from its own VS auto-detection, rather than forwarding the
          # inherited LIB env var through to link.exe - confirmed, LIB was
          # correctly set in the process environment but never reached the
          # actual link command. -L/LIBPATH is a flag dmd does forward
          # directly onto the link line, same as how libs-windows in
          # curl's own dub.json already correctly produces /DEFAULTLIB.
          echo "DFLAGS=-L/LIBPATH:$installed\lib" >> $env:GITHUB_ENV

      - name: sljit
        id: sljit
        continue-on-error: true
        shell: bash
        working-directory: importc-sljit/examples/add
        run: dub run

      - name: zlib
        id: zlib
        continue-on-error: true
        shell: bash
        working-directory: importc-zlib/examples/roundtrip
        run: dub run

      - name: curl
        id: curl
        continue-on-error: true
        shell: bash
        working-directory: importc-curl/examples/version_check
        run: dub run

      - name: sqlite (expected to fail - Milestone 2 blocker)
        id: sqlite
        continue-on-error: true
        shell: bash
        working-directory: importc-sqlite
        run: dmd -m64 -c -P=-DSQLITE_OMIT_SEH sqlite_src/sqlite3.c

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "sljit:  ${{ steps.sljit.outcome }}"
          echo "zlib:   ${{ steps.zlib.outcome }}"
          echo "curl:   ${{ steps.curl.outcome }}"
          echo "sqlite: ${{ steps.sqlite.outcome }} (expected failure)"
