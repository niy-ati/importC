        # different MSVC intrinsics from one file instead of just __cpuidex,
        # to test whether it's the combination/volume of distinct intrinsics
        # in one translation unit that breaks, not any single one alone.

      - name: Minimal repro, windows.h only, no importc_msvc_builtins.h
        shell: bash
        continue-on-error: true # expected to fail, that's the point of this step
        run: |
          mkdir -p minrepro3 && cd minrepro3
