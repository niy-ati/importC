            '        sljit_emit_op1(compiler, SLJIT_MOV, SLJIT_RETURN_REG, 0, SLJIT_IMM, 42);' \
            '        sljit_emit_return(compiler, SLJIT_MOV, SLJIT_RETURN_REG, 0);' \
