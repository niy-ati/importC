          MSYS_NO_PATHCONV: 1
        run: |
          mkdir -p reduce2 && cd reduce2
          printf '%s\n' \
            '#include "sljitLir.h"' \
            '#include <stdio.h>' \
            '' \
            'void *sljit_test_malloc_exec(sljit_uw size, void *exec_allocator_data) {' \
            '    return SLJIT_BUILTIN_MALLOC_EXEC(size, exec_allocator_data);' \
            '}' \
            'void sljit_test_free_code(void *code, void *exec_allocator_data) {' \
            '    SLJIT_BUILTIN_FREE_EXEC(code, exec_allocator_data);' \
            '}' \
            '' \
            'int main(void) {' \
            '    int i;' \
            '    for (i = 0; i < 200; i++) {' \
            '        union { void *code; sljit_sw (SLJIT_FUNC *func)(void); } code;' \
            '        struct sljit_compiler *compiler = sljit_create_compiler(NULL);' \
            '        struct sljit_const *c;' \
            '        sljit_uw addr;' \
            '        sljit_sw executable_offset;' \
            '        if (!compiler) { printf("iter %d: no compiler\n", i); return 1; }' \
            '        sljit_emit_enter(compiler, 0, SLJIT_ARGS0(W), 2, 1, 0);' \
            '        c = sljit_emit_const(compiler, SLJIT_MOV, SLJIT_RETURN_REG, 0, 11);' \
            '        sljit_emit_return(compiler, SLJIT_MOV, SLJIT_RETURN_REG, 0);' \
            '        code.code = sljit_generate_code(compiler, 0, NULL);' \
