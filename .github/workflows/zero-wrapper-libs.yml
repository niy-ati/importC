            '}' > reduce2.c
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          CFLAGS="-m64 -release -O -P=/FIimportc_msvc_builtins.h -P=/I../importc-sljit/sljit_src -P=/I../sljit-test -P=-DSLJIT_HAVE_CONFIG_PRE=1 -I../importc-sljit/sljit_src -I../sljit-test"
          "$DMD" $CFLAGS -c -of=shims_r2.obj ../importc-sljit/sljit_src/msvc_intrinsic_shims.c
          "$DMD" $CFLAGS -allinst -L/DEFAULTLIB:mincore.lib -L/STACK:0x400000 -of=reduce2.exe reduce2.c ../importc-sljit/sljit_src/sljitLir.c shims_r2.obj
          echo "build exit=$?"
          ./reduce2.exe
          echo "run exit=$?"
        # test11 (the first test earlier bisection runs showed crashing
        # inconsistently) is sljit's own first use of rewritable constants,
        # emitting a const, running the code, then patching the const's
        # value in already-generated memory and running again. That write-
        # after-generate pattern touches the executable memory region a
        # second time after sljit_generate_code, unlike the plain loop
        # above - testing whether that specific pattern is the trigger.

      - name: Preprocess sljitLir.c with real cl.exe, then run DustMite on it
        shell: bash
        continue-on-error: true
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          mkdir -p reduce3 && cd reduce3
          BUILTINS_DIR=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/druntime/src/include")
          # _NO_CRT_STDIO_INLINE skips the UCRT's __CRTDECL inline bodies
          # for the wide-print family (_fwprintf_l etc). Those inline
          # bodies call the compiler-intrinsic __va_start, which cl.exe's
          # own front end recognizes and never actually emits as a call -
          # once preprocessed into plain text, ImportC sees a bare
          # unresolved external instead. Skipping the inline bodies keeps
          # the preprocessed source using the real, linkable DLL imports.
          PPFLAGS="/nologo /std:c11 /P /DWIN32_LEAN_AND_MEAN /D_NO_CRT_STDIO_INLINE=1 /DSLJIT_HAVE_CONFIG_PRE=1 /FI$BUILTINS_DIR\\importc_msvc_builtins.h /I$BUILTINS_DIR /I../importc-sljit/sljit_src /I../sljit-test"
          cl.exe $PPFLAGS ../importc-sljit/sljit_src/sljitLir.c
          echo "preprocess sljitLir exit=$?"
          cl.exe $PPFLAGS ../sljit-test/sljitMain.c
          echo "preprocess sljitMain exit=$?"
          cl.exe $PPFLAGS ../sljit-test/sljitTest.c
          echo "preprocess sljitTest exit=$?"
          wc -l sljitLir.i sljitMain.i sljitTest.i
          cp sljitLir.i sljitLir_reduced.c
          cp sljitMain.i sljitMain.c
          cp sljitTest.i sljitTest.c
          cp ../importc-sljit/sljit_src/msvc_intrinsic_shims.c .
          cp ../importc-sljit/sljit_src/sljitLir.h .
          mkdir -p dustmite_src && cd dustmite_src
          curl -sL "https://raw.githubusercontent.com/CyberShadow/DustMite/master/dustmite.d" -o dustmite.d
          curl -sL "https://raw.githubusercontent.com/CyberShadow/DustMite/master/polyhash.d" -o polyhash.d
          curl -sL "https://raw.githubusercontent.com/CyberShadow/DustMite/master/splitter.d" -o splitter.d
          ls -la
          cd ..
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          "$DMD" -m64 -of=dustmite.exe dustmite_src/dustmite.d dustmite_src/polyhash.d dustmite_src/splitter.d
          echo "dustmite build exit=$?"
          ls -la dustmite.exe || echo "dustmite did not build"
        # Nicholas's call: just try dustmite and see. Preprocessing all three
        # files (not just sljitLir.c) with real cl.exe's /P removes macros
        # and nested #includes before reduction even starts, and keeps
        # every file's copy of the system headers' struct layouts frozen
        # identically - preprocessing only sljitLir.c caused a real struct-
        # packing mismatch against the other two files' fresh ImportC
        # parse. This should help dustmite handle
        # it even if it can't parse raw ImportC-flavoured C well on its own.

      - name: Run DustMite reduction, bounded to one CI-sized pass
        shell: bash
        continue-on-error: true
        timeout-minutes: 20
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          cd reduce3
          mkdir -p target
          cp sljitLir_reduced.c target/
          cp sljitMain.c target/
          cp sljitTest.c target/
          cp msvc_intrinsic_shims.c target/
          cp ../importc-sljit/sljit_src/*.h target/
          cp ../sljit-test/sljitConfigPre.h target/
          cp ../sljit-test/sljitConfigPost.h target/
          cp ../sljit-test/sljitTestBuffers.h target/
          cp ../sljit-test/sljitTestCall.h target/
          cp ../sljit-test/sljitTestFloat.h target/
          cp ../sljit-test/sljitTestSerialize.h target/
          cp ../sljit-test/sljitTestSimd.h target/
          BUILTINS_DIR=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/druntime/src/include")
          cp "$(cygpath -u "$BUILTINS_DIR")/importc_msvc_builtins.h" target/
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          printf '%s\r\n' \
            '@echo off' \
            "\"$DMD\" -m64 -allinst -P=/I. -P=/FIimportc_msvc_builtins.h -P=-DSLJIT_HAVE_CONFIG_PRE=1 -c -oftest_obj.obj sljitTest.c >nul 2>nul" \
            'if errorlevel 1 exit /b 1' \
            "\"$DMD\" -m64 -allinst -P=/I. -P=/FIimportc_msvc_builtins.h -P=-DSLJIT_HAVE_CONFIG_PRE=1 -L/DEFAULTLIB:mincore.lib -L/STACK:0x400000 -ofout.exe sljitLir_reduced.c sljitMain.c msvc_intrinsic_shims.c test_obj.obj >nul 2>nul" \
            'if errorlevel 1 exit /b 1' \
            'out.exe -v >nul 2>nul' \
            'set RC=%errorlevel%' \
            'if %RC% LSS 0 exit /b 0' \
            'if %RC% GTR 138 exit /b 0' \
            'exit /b 1' > target/test.cmd
          cat target/test.cmd
          echo "--- sanity check: raw build with real output first ---"
          set +e
          pushd target > /dev/null
          "$DMD" -m64 -allinst -P=/I. -P=/FIimportc_msvc_builtins.h -P=-DSLJIT_HAVE_CONFIG_PRE=1 -c -oftest_obj.obj sljitTest.c
          echo "sljitTest.c compile exit=$?"
          "$DMD" -m64 -allinst -P=/I. -P=/FIimportc_msvc_builtins.h -P=-DSLJIT_HAVE_CONFIG_PRE=1 -L/DEFAULTLIB:mincore.lib -L/STACK:0x400000 -ofout.exe sljitLir_reduced.c sljitMain.c msvc_intrinsic_shims.c test_obj.obj
          echo "raw build exit=$?"
          ./out.exe -v
          echo "raw run exit=$?"
          echo "--- now via test.cmd ---"
          cmd /c test.cmd
          echo "manual test.cmd exit=$?"
          popd > /dev/null
          set -e
          # The sanity build above writes its outputs into target/ itself -
          # clean those back out so DustMite doesn't load our own build
          # artifacts as part of the source tree to reduce.
          rm -f target/out.exe target/out.obj target/test_obj.obj
          echo "--- handing off to dustmite ---"
          # Without --split, DustMite treats each .c/.h file as a single
          # atomic leaf (can only be kept or removed whole) - it never
          # looks inside it. --split *.{c,h}:d turns on its D-style
          # brace/semicolon-aware splitter for these files, which is what
          # actually lets it shrink the 200K-line reproduction instead of
          # just shuffling whole files around.
          # test.cmd has to live inside target/ for dustmite to be able to
          # run it against each candidate reduction, but that also puts it
          # in the reducible tree - without --noremove, dustmite happily
          # discovered that an EMPTY test.cmd exits 0 and is therefore
          # "interesting", and reduced every real file away to nothing.
          # Confirmed directly: the previous run's target.reduced/ had no
          # source files left at all, just a 0-byte test.cmd.
          ./dustmite.exe --split '*.{c,h}:d' --noremove 'test\.cmd' target test.cmd
          echo "dustmite exit=$?"
          # DustMite never modifies "target" in place - the actual reduced
          # result lands in the sibling "target.reduced" directory. Checking
          # target/ here was a bug: it always shows the untouched original.
          wc -l target.reduced/sljitLir_reduced.c || echo "no target.reduced - dustmite made no changes at all"
          ls -la target.reduced/ || true
        # DustMite copies "target" and repeatedly tries shrinking files in
        # it, keeping any change where test.cmd still exits 0 (our crash
        # signature: the real run exit code falls outside the legitimate
        # 0-138 "N tests failed" range - covers both the raw NT stack-
        # overflow code and anything git-bash remaps, since cmd.exe exposes
        # the unmapped %errorlevel% directly).
        # 208K preprocessed lines means one 20-minute CI pass only makes
        # partial progress - the point today is confirming the pipeline
        # actually works and reduces something real, not finishing the
        # full reduction in one run. Can resume with --state on a later run.

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dustmite-reduced
          path: reduce3/target.reduced
          if-no-files-found: ignore

  sljit-windows-asan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - name: Fetch sljit's own test suite
        shell: bash
        run: |
          mkdir -p sljit-test
          curl -sL "https://raw.githubusercontent.com/zherczeg/sljit/39c508d1/test_src/sljitMain.c" -o sljit-test/sljitMain.c
          curl -sL "https://raw.githubusercontent.com/zherczeg/sljit/39c508d1/test_src/sljitTest.c" -o sljit-test/sljitTest.c
          for f in sljitTestBuffers.h sljitTestCall.h sljitTestFloat.h sljitTestSerialize.h sljitTestSimd.h sljitConfigPre.h sljitConfigPost.h; do
            curl -sL "https://raw.githubusercontent.com/zherczeg/sljit/39c508d1/test_src/$f" -o "sljit-test/$f"
          done
      - name: Build with LDC and AddressSanitizer
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          which ldc2
          ldc2 --version
          ldc2 -m64 -O -g -c -of=builtins_msvc.obj ldc-msvc-builtins/__builtins_msvc.d
          echo "builtins build exit=$?"
          mkdir -p minrepro_ldc && cd minrepro_ldc
          printf '%s\n' \
            '#include <importc_msvc_builtins.h>' \
            '' \
            'void test(int *a) {' \
            '    __cpuidex(a, 0, 0);' \
            '}' > test.c
          printf '%s\n' \
            'extern(C) void test(int* a);' \
            'void main() { int[4] a; test(a.ptr); }' > main.d
          set +e
          ldc2 -m64 -allinst -P=-I../ldc-msvc-builtins -P=/FIimportc_msvc_builtins.h -I../ldc-msvc-builtins -c -of=test.obj test.c
          echo "minimal repro compile exit=$?"
          ldc2 -m64 -allinst -I../ldc-msvc-builtins -of=test.exe main.d test.obj ../builtins_msvc.obj
          echo "minimal repro link exit=$?"
          set -e
          cd ..
          CFLAGS="-m64 -O -g -P=-DWIN32_LEAN_AND_MEAN -P=-Iimportc-sljit/sljit_src -P=-Isljit-test -P=/FIimportc_msvc_builtins.h -P=-Ildc-msvc-builtins -Iimportc-sljit/sljit_src -Isljit-test -Ildc-msvc-builtins -fsanitize=address"
          ldc2 $CFLAGS -c -of=shims_asan.obj importc-sljit/sljit_src/msvc_intrinsic_shims.c
          ldc2 $CFLAGS -allinst -c -of=sljitTest_asan.obj sljit-test/sljitTest.c
          ldc2 $CFLAGS -allinst -L/DEFAULTLIB:mincore.lib -of=testsuite_asan.exe importc-sljit/sljit_src/sljitLir.c sljit-test/sljitMain.c shims_asan.obj sljitTest_asan.obj builtins_msvc.obj
          echo "build exit=$?"
          ./testsuite_asan.exe -v
          echo "run exit=$?"
        # Nicholas's suggestion: if it's genuine memory corruption rather
        # than organic stack exhaustion, AddressSanitizer should catch the
        # exact faulting access with a real report (buffer over/underflow,
        # use-after-free, stack-buffer-overflow, etc), unlike cdb's generic
        # exception info. LDC exposes -fsanitize=address directly since it's
        # LLVM-based; dmd has no equivalent flag, which is why this needs
        # its own job with the LDC compiler instead of the dmd-from-source
        # build the rest of this workflow uses.
        # LDC's own druntime has no equivalent of dmd's MSVC-intrinsic
        # redirect at all (confirmed empty grep for __cpuidex across its
        # whole druntime source) - ldc-msvc-builtins/ is dmd's real,
        # already-working __builtins_msvc.d and its header, copied in and
        # compiled as plain D (no ImportC involved for that file), force-
        # included and linked the same way dmd's own build does it.

  zlib:
    needs: build-dmd
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dmd-Linux, path: . }
      - run: chmod +x dmd-src/generated/linux/release/64/dmd
      - uses: dlang-community/setup-dlang@v1
      - name: Build and run the zlib zero-wrapper example
        working-directory: importc-zlib/examples/roundtrip
        run: dub build --compiler=$GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd && ./zlib-roundtrip-example

  curl:
    needs: build-dmd
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dmd-Linux, path: . }
      - run: chmod +x dmd-src/generated/linux/release/64/dmd
      - uses: dlang-community/setup-dlang@v1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev
      - name: Build and run the curl zero-wrapper example
        working-directory: importc-curl/examples/version_check
        run: dub build --compiler=$GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd && ./curl-version-example

  sdl:
    needs: build-dmd
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dmd-Linux, path: . }
      - run: chmod +x dmd-src/generated/linux/release/64/dmd
      - uses: dlang-community/setup-dlang@v1
      - name: Build SDL3 from source
        run: |
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL-build -DSDL_VIDEO=OFF -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/SDL-build -j$(nproc)
          mkdir -p importc-sdl/lib/linux-x64
          cp -P /tmp/SDL-build/libSDL3.so* importc-sdl/lib/linux-x64/
        # Built here instead of vendored in the repo: a prebuilt .so bakes in
        # the glibc of whatever machine compiled it (glibc 2.38 added
        # __isoc23_* versioned symbols for strtol/scanf C23 support), so a
        # binary built on a newer system fails to link on this older runner.
        # Building fresh against this runner's own glibc avoids that entirely.
      - name: Build and run the SDL3 zero-wrapper example
        working-directory: importc-sdl/examples/version_check
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/importc-sdl/lib/linux-x64
        run: dub build --compiler=$GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd && ./sdl-version-example

  sqlite:
    needs: build-dmd
    runs-on: ubuntu-22.04
    continue-on-error: true # expected to fail until Milestone 2 lands
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dmd-Linux, path: . }
      - run: chmod +x dmd-src/generated/linux/release/64/dmd
      - uses: dlang-community/setup-dlang@v1
      - name: Attempt to build sqlite (tracks Milestone 2 progress)
        working-directory: importc-sqlite
        run: $GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd -c -Isqlite_src sqlite_src/sqlite3.c
