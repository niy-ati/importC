name: ImportC zero-wrapper libraries - end to end

# CI matrix for the zero-wrapper library packages (SAOC 2026, Milestone 1),
# separate from e2e.yml's SDL2/bindbc test. Builds dmd from niy-ati/dmd
# master (all four Milestone 1 fixes are merged upstream now), then
# compiles and runs each library's own zero-wrapper example against it,
# so every push shows a clear pass/fail per library rather than one
# all-or-nothing status.
#
# sqlite is intentionally not built here yet: it needs the Windows SEH/
# dllimport-address fixes and the Linux __int128 fix from Milestone 2 first.
# It stays in the matrix so its failure is visible, not silently skipped.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-dmd:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dlang/dmd
          ref: master
          path: dmd-src

      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: dmd-latest

      - name: Build dmd from source (host compiler from setup-dlang)
        working-directory: dmd-src/compiler/src
        shell: bash
        run: ./build.d

      - name: Build druntime (Linux)
        shell: bash
        run: |
          DMD=$GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd
          make -C dmd-src/druntime -j$(nproc) -f posix.mak DMD=$DMD
          cp dmd-src/druntime/src/__importc_builtins.di dmd-src/druntime/import/__importc_builtins.di
          cp dmd-src/druntime/src/__builtins_msvc.d dmd-src/druntime/import/__builtins_msvc.d

      - name: Checkout and build phobos (Linux)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/dlang/phobos.git phobos
          DMD=$GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd
          make -C phobos -j$(nproc) -f posix.mak DMD=$DMD DMD_DIR=../dmd-src DRUNTIME_PATH=$GITHUB_WORKSPACE/dmd-src/druntime
          # dmd.conf resolves phobos as a sibling of dmd-src, matching this layout

      - uses: actions/upload-artifact@v4
        with:
          name: dmd-Linux
          path: |
            dmd-src/generated
            dmd-src/druntime
            phobos

  build-dmd-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dlang/dmd
          ref: master
          path: dmd-src

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: dmd-latest

      - name: Build dmd from source
        shell: bash
        run: |
          cd dmd-src
          make -j$(nproc) MODEL=64 HOST_DMD=dmd ENABLE_RELEASE=1 ENABLE_ASSERTS=1 dmd

      - name: Link the default Windows system libraries
        shell: bash
        run: |
          CONF=dmd-src/generated/windows/release/64/sc.ini
          cat "$CONF"
          sed -i 's|^DFLAGS=%DFLAGS% -L/OPT:NOICF|DFLAGS=%DFLAGS% -L/OPT:NOICF -L/DEFAULTLIB:kernel32.lib -L/DEFAULTLIB:ntdll.lib -L/DEFAULTLIB:user32.lib|' "$CONF"
          cat "$CONF"
        # Officially-released dmd links fine against these without asking,
        # since cl.exe-compiled objects carry embedded #pragma comment(lib,...)
        # directives for them. Our from-source build's auto-generated sc.ini
        # has none, so druntime's own kernel32/ntdll/user32 calls (NtCurrentTeb,
        # RtlSetVolatileMemory, CharUpperW, etc) come back unresolved at link
        # time for every downstream package, not just sljit's own code.

      - name: Build druntime
        shell: bash
        run: |
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          make -j$(nproc) -C dmd-src/druntime MODEL=64 DMD="$DMD" CC=cl.exe
          cp dmd-src/druntime/src/__importc_builtins.di dmd-src/druntime/import/__importc_builtins.di
          cp dmd-src/druntime/src/__builtins_msvc.d dmd-src/druntime/import/__builtins_msvc.d

      - name: Checkout and build phobos
        shell: bash
        run: |
          git clone --depth 1 https://github.com/dlang/phobos.git phobos
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          make -j$(nproc) -C phobos MODEL=64 DMD="$DMD" CC=cl.exe DMD_DIR=../dmd-src

      - uses: actions/upload-artifact@v4
        with:
          name: dmd-Windows
          path: |
            dmd-src/generated
            dmd-src/druntime
            phobos

  sljit:
    needs: build-dmd
    runs-on: ubuntu-22.04
    continue-on-error: true # expected to fail on Linux until ImportC supports GNU inline asm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dmd-Linux, path: . }
      - run: chmod +x dmd-src/generated/linux/release/64/dmd
      - uses: dlang-community/setup-dlang@v1
      - name: Build and run the sljit zero-wrapper example
        working-directory: importc-sljit/examples/add
        run: dub build --compiler=$GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd && ./sljit-add-example
        # sljit_create_compiler unconditionally calls get_cpu_features(), which
        # hits GNU inline asm on Linux - ImportC turns that into a runtime
        # assert, so this fails here regardless of which sljit API is used.
        # Windows uses the MSVC intrinsics path instead and doesn't hit this,
        # see the sljit-windows job.

  sljit-windows:
    needs: build-dmd-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dmd-Windows, path: . }
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: dlang-community/setup-dlang@v1
      - name: Check which actual .lib exports the 4 remaining symbols
        shell: pwsh
        run: |
          $names = @("vcruntime.lib","libvcruntime.lib","ntdll.lib","kernel32.lib","ucrt.lib","libucrt.lib")
          foreach ($n in $names) {
            $f = Get-ChildItem -Path ($env:LIB -split ';') -Filter $n -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($f) {
              "=== $n : $($f.FullName) ==="
              & dumpbin /symbols $f.FullName | Select-String "arch_inverted|arch_avx10ver|MapViewOfFileNuma2|RtlSetVolatileMemory"
            } else {
              "=== $n : not found on LIB path ==="
            }
          }
        # Previous check (vcruntime.lib + ntdll.lib only) found none of the 4
        # symbols in either - both came back empty, ruling that guess out.
        # Casting wider here: kernel32.lib for the two real Win32 API names,
        # and the static lib* variants in case the CPU-dispatch data lives
        # only in the static runtime, not the DLL import stub.

      - name: Read the real SDK header source for the 4 remaining symbols
        shell: pwsh
        run: |
          $roots = $env:INCLUDE -split ';' | Where-Object { $_ }
          $pattern = 'arch_inverted|arch_avx10ver|MapViewOfFileNuma2|RtlSetVolatileMemory'
          foreach ($r in $roots) {
            Get-ChildItem -Path $r -Filter *.h -Recurse -ErrorAction SilentlyContinue |
              Select-String -Pattern $pattern -ErrorAction SilentlyContinue |
              ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
          }
        # Grepping the actual Windows SDK / UCRT / VC header source on the
        # runner for how these 4 are really declared, instead of guessing
        # which .lib should have them (that came back empty for all 6
        # checked). This shows the real context: inline/forceinline wrapper,
        # macro, or something version-gated.

      - name: Search every lib on the runner for MapViewOfFileNuma2 specifically
        shell: pwsh
        run: |
          $libDirs = @(
            "C:\Program Files (x86)\Windows Kits\10\Lib\10.0.26100.0\um\x64",
            "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.51.36231\lib\x64"
          )
          foreach ($d in $libDirs) {
            Get-ChildItem -Path $d -Filter *.lib -ErrorAction SilentlyContinue | ForEach-Object {
              $hits = & dumpbin /linkermember:1 $_.FullName 2>$null | Select-String -Pattern "MapViewOfFileNuma2"
              if ($hits) { "$($_.Name): $hits" }
            }
          }
        # WINBASEAPI/WINAPI in memoryapi.h means this one really is a normal
        # dllimport kernel32 export, unlike the other 3 (plain extern, no
        # import annotation at all - those are MSVC-recognized pseudo-
        # intrinsics that real cl.exe never actually links either). Scanning
        # every .lib on the runner by actual export name, not just the 6
        # obvious candidates, since /symbols alone found nothing in kernel32.lib.

      - name: Read the full context around each declaration
        shell: pwsh
        run: |
          $vc = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.51.36231\include\immintrin.h"
          $winnt = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\um\winnt.h"
          $memapi = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\um\memoryapi.h"
          "=== immintrin.h 95-145 ==="
          (Get-Content $vc)[94..144]
          "=== winnt.h 23240-23280 ==="
          (Get-Content $winnt)[23239..23279]
          "=== memoryapi.h 895-925 ==="
          (Get-Content $memapi)[894..924]
        # The grep above found exact line numbers for all 4 symbols. Reading
        # the surrounding declaration context (declspec, calling convention,
        # any version/feature guard) to find out how real cl.exe actually
        # resolves these at link time, since no .lib on this runner exports
        # any of them as a plain symbol.

      - name: Minimal repro, just one call to __cpuidex
        shell: bash
        run: |
          mkdir -p minrepro && cd minrepro
          printf '%s\n' \
            '#include <importc_msvc_builtins.h>' \
            '' \
            'void test(int a[static 4]) {' \
            '    __cpuidex(a, 0, 0);' \
            '}' > test.c
          printf '%s\n' \
            'extern(C) void test(int* a);' \
            'void main() { int[4] a; test(a.ptr); }' > main.d
          cat test.c
          cat main.d
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          "$DMD" -m64 -lib -P=-DWIN32_LEAN_AND_MEAN -oftest.lib test.c
          echo "library build exit=$?"
          "$DMD" -m64 -oftest.exe main.d test.lib
          echo "link exit=$?"
        # Two stages on purpose, same shape as the real build: a library
        # object compiled from C, then linked into a separate D executable.
        # A single-file link doesn't reproduce the real failure.

      - name: Minimal repro, several different intrinsics in one file
        shell: bash
        run: |
          mkdir -p minrepro2 && cd minrepro2
          printf '%s\n' \
            '#include <importc_msvc_builtins.h>' \
            '' \
            'void test(int a[static 4], unsigned long long *hi) {' \
            '    __cpuidex(a, 0, 0);' \
            '    unsigned long long x = _xgetbv(0);' \
            '    unsigned long long lo = _umul128(2, 3, hi);' \
            '    _InterlockedExchangeAdd64((long long*)hi, 1);' \
            '    _ReadWriteBarrier();' \
            '    a[0] = (int)(x + lo);' \
            '}' > test.c
          printf '%s\n' \
            'extern(C) void test(int* a, ulong* hi);' \
            'void main() { int[4] a; ulong hi; test(a.ptr, &hi); }' > main.d
          cat test.c
          cat main.d
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          "$DMD" -m64 -lib -P=-DWIN32_LEAN_AND_MEAN -oftest.lib test.c
          echo "library build exit=$?"
          "$DMD" -m64 -oftest.exe main.d test.lib
          echo "link exit=$?"
        # Same two-stage shape as the previous repro, but calling several
        # different MSVC intrinsics from one file instead of just __cpuidex,
        # to test whether it's the combination/volume of distinct intrinsics
        # in one translation unit that breaks, not any single one alone.

      - name: Minimal repro, windows.h only, no importc_msvc_builtins.h
        shell: bash
        continue-on-error: true # expected to fail, that's the point of this step
        run: |
          mkdir -p minrepro3 && cd minrepro3
          printf '%s\n' \
            '#include <windows.h>' \
            '' \
            'void test(int a[static 4]) {' \
            '    __cpuidex(a, 0, 0);' \
            '}' > test.c
          printf '%s\n' \
            'extern(C) void test(int* a);' \
            'void main() { int[4] a; test(a.ptr); }' > main.d
          cat test.c
          cat main.d
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          "$DMD" -m64 -lib -P=-DWIN32_LEAN_AND_MEAN -oftest.lib test.c
          echo "library build exit=$?"
          "$DMD" -m64 -oftest.exe main.d test.lib
          echo "link exit=$?"
        # sljitLir.c includes <windows.h> but never includes
        # importc_msvc_builtins.h anywhere (grepped the whole package, no
        # match). The first repro included both headers and worked; this
        # one matches sljitLir.c's real include set exactly - windows.h
        # only - to see if that alone reproduces the real LNK2019 instead of
        # a compile-time "undefined identifier" error.

      - name: Same repro, forcing the include without touching the source
        shell: bash
        continue-on-error: true # keep going so the later real-build steps still run
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          cd minrepro3
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          "$DMD" -m64 -lib -P=-DWIN32_LEAN_AND_MEAN -P=/FIimportc_msvc_builtins.h -oftest2.lib test.c
          echo "library build exit=$?"
          "$DMD" -m64 -oftest2.exe main.d test2.lib
          echo "link exit=$?"
        # Same test.c as the previous step, unmodified - just force-including
        # importc_msvc_builtins.h via a compiler flag instead of editing the
        # source. If this links clean, the same flag applied to sljit's own
        # build (via dflags-windows in dub.json, not the vendored .c file)
        # should fix it without violating "runs unmodified from D".
        # MSYS_NO_PATHCONV stops Git Bash from mangling the /FI... argument
        # into a bogus Windows path before it reaches cl.exe.

      - name: Compile sljitLir.obj
        shell: bash
        working-directory: importc-sljit
        run: |
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          "$DMD" -m64 -c -P=-DWIN32_LEAN_AND_MEAN -Isljit_src sljit_src/sljitLir.c -ofsljitLir.obj
          echo "compile exit=$?"
          ls -la sljitLir.obj

      - name: Dump its symbol table via cmd, not bash
        shell: cmd
        working-directory: importc-sljit
        run: dumpbin /symbols sljitLir.obj > symbols.txt

      - name: Show the matching symbols
        shell: bash
        working-directory: importc-sljit
        run: |
          wc -l symbols.txt
          grep -i "cpuidex\|xgetbv\|umul128" symbols.txt ; echo "grep exit=$?"

      - name: Build and run the sljit zero-wrapper example
        shell: bash
        working-directory: importc-sljit/examples/add
        run: |
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          DFLAGS=-allinst dub build --compiler="$DMD" --build=release
          ./sljit-add-example.exe

      - name: Fetch sljit's own test suite
        shell: bash
        run: |
          mkdir -p sljit-test
          for f in sljitMain.c sljitTest.c sljitTestBuffers.h sljitTestCall.h sljitTestFloat.h sljitTestSerialize.h sljitTestSimd.h sljitConfigPre.h sljitConfigPost.h; do
            curl -sL "https://raw.githubusercontent.com/zherczeg/sljit/39c508d1/test_src/$f" -o "sljit-test/$f"
          done
        # Pinned to the same commit this package vendors (see README), so the
        # test suite matches the library it's actually testing.

      - name: Build and run sljit's own test suite, unmodified
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          "$DMD" -m64 -release -O -allinst -P=/FIimportc_msvc_builtins.h -Iimportc-sljit/sljit_src -Isljit-test -ofsljit-test/sljit-test-suite.exe \
            importc-sljit/sljit_src/sljitLir.c sljit-test/sljitMain.c sljit-test/sljitTest.c
          ./sljit-test/sljit-test-suite.exe -s
        # Milestone 1: "confirm its own JIT test suite runs unmodified from D".
        # sljit_test() returns TEST_COUNT - successful_tests, so a 0 exit
        # code here means every one of its 138 tests genuinely passed.

  zlib:
    needs: build-dmd
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dmd-Linux, path: . }
      - run: chmod +x dmd-src/generated/linux/release/64/dmd
      - uses: dlang-community/setup-dlang@v1
      - name: Build and run the zlib zero-wrapper example
        working-directory: importc-zlib/examples/roundtrip
        run: dub build --compiler=$GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd && ./zlib-roundtrip-example

  curl:
    needs: build-dmd
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dmd-Linux, path: . }
      - run: chmod +x dmd-src/generated/linux/release/64/dmd
      - uses: dlang-community/setup-dlang@v1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev
      - name: Build and run the curl zero-wrapper example
        working-directory: importc-curl/examples/version_check
        run: dub build --compiler=$GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd && ./curl-version-example

  sdl:
    needs: build-dmd
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dmd-Linux, path: . }
      - run: chmod +x dmd-src/generated/linux/release/64/dmd
      - uses: dlang-community/setup-dlang@v1
      - name: Build SDL3 from source
        run: |
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL-build -DSDL_VIDEO=OFF -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/SDL-build -j$(nproc)
          mkdir -p importc-sdl/lib/linux-x64
          cp -P /tmp/SDL-build/libSDL3.so* importc-sdl/lib/linux-x64/
        # Built here instead of vendored in the repo: a prebuilt .so bakes in
        # the glibc of whatever machine compiled it (glibc 2.38 added
        # __isoc23_* versioned symbols for strtol/scanf C23 support), so a
        # binary built on a newer system fails to link on this older runner.
        # Building fresh against this runner's own glibc avoids that entirely.
      - name: Build and run the SDL3 zero-wrapper example
        working-directory: importc-sdl/examples/version_check
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/importc-sdl/lib/linux-x64
        run: dub build --compiler=$GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd && ./sdl-version-example

  sqlite:
    needs: build-dmd
    runs-on: ubuntu-22.04
    continue-on-error: true # expected to fail until Milestone 2 lands
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dmd-Linux, path: . }
      - run: chmod +x dmd-src/generated/linux/release/64/dmd
      - uses: dlang-community/setup-dlang@v1
      - name: Attempt to build sqlite (tracks Milestone 2 progress)
        working-directory: importc-sqlite
        run: $GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd -c -Isqlite_src sqlite_src/sqlite3.c
