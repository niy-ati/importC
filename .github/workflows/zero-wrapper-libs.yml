          "$DMD" -m64 -oftest.exe main.d test.lib
          echo "link exit=$?"
        # Two stages on purpose, same shape as the real build: a library
        # object compiled from C, then linked into a separate D executable.
        # A single-file link doesn't reproduce the real failure.

      - name: Minimal repro, several different intrinsics in one file
        shell: bash
        run: |
          mkdir -p minrepro2 && cd minrepro2
          printf '%s\n' \
            '#include <importc_msvc_builtins.h>' \
            '' \
            'void test(int a[static 4], unsigned long long *hi) {' \
            '    __cpuidex(a, 0, 0);' \
            '    unsigned long long x = _xgetbv(0);' \
            '    unsigned long long lo = _umul128(2, 3, hi);' \
            '    _InterlockedExchangeAdd64((long long*)hi, 1);' \
            '    _ReadWriteBarrier();' \
            '    a[0] = (int)(x + lo);' \
            '}' > test.c
          printf '%s\n' \
            'extern(C) void test(int* a, ulong* hi);' \
