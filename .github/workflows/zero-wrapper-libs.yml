        # and ImportC. If this ALSO crashes, the bug is in sljit itself or
        # this environment, not in ImportC's codegen. If this runs clean,
        # it proves the corruption is specific to how dmd's ImportC
        # translates this C code to machine code - a precise, actionable,
        # upstream-reportable finding either way.

      - name: Reduce to a minimal repro - loop the JIT lifecycle, no test harness at all
        shell: bash
