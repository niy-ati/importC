        # work." Same real build, just without -release -O, to check
        # whether optimized codegen specifically is what triggers the
        # corruption cdb caught, before investigating anything deeper.

      - name: Build the same test suite with real cl.exe, no D or ImportC at all
        shell: bash
        continue-on-error: true
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          cl.exe /nologo /std:c11 /O2 /DSLJIT_HAVE_CONFIG_PRE=1 /Iimportc-sljit/sljit_src /Isljit-test /Fe:sljit-test/sljit-test-suite-native.exe \
            importc-sljit/sljit_src/sljitLir.c sljit-test/sljitMain.c sljit-test/sljitTest.c \
            /link mincore.lib /STACK:0x400000
