name: ImportC zero-wrapper libraries - end to end

# CI matrix for the zero-wrapper library packages (SAOC 2026, Milestone 1),
# separate from e2e.yml's SDL2/bindbc test. Builds dmd from niy-ati/dmd
# master (all four Milestone 1 fixes are merged upstream now), then
# compiles and runs each library's own zero-wrapper example against it,
# so every push shows a clear pass/fail per library rather than one
# all-or-nothing status.
#
# sqlite is intentionally not built here yet: it needs the Windows SEH/
# dllimport-address fixes and the Linux __int128 fix from Milestone 2 first.
# It stays in the matrix so its failure is visible, not silently skipped.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-dmd:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dlang/dmd
          ref: master
          path: dmd-src

      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: dmd-latest

      - name: Build dmd from source (host compiler from setup-dlang)
        working-directory: dmd-src/compiler/src
        shell: bash
        run: ./build.d

      - name: Build druntime (Linux)
        shell: bash
        run: |
          DMD=$GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd
          make -C dmd-src/druntime -j$(nproc) -f posix.mak DMD=$DMD
          cp dmd-src/druntime/src/__importc_builtins.di dmd-src/druntime/import/__importc_builtins.di
          cp dmd-src/druntime/src/__builtins_msvc.d dmd-src/druntime/import/__builtins_msvc.d

      - name: Checkout and build phobos (Linux)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/dlang/phobos.git phobos
          DMD=$GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd
          make -C phobos -j$(nproc) -f posix.mak DMD=$DMD DMD_DIR=../dmd-src DRUNTIME_PATH=$GITHUB_WORKSPACE/dmd-src/druntime
          # dmd.conf resolves phobos as a sibling of dmd-src, matching this layout

      - uses: actions/upload-artifact@v4
        with:
          name: dmd-Linux
          path: |
            dmd-src/generated
            dmd-src/druntime
            phobos

  build-dmd-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dlang/dmd
          ref: master
          path: dmd-src

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: dmd-latest

      - name: Build dmd from source
        shell: bash
        run: |
          cd dmd-src
          make -j$(nproc) MODEL=64 HOST_DMD=dmd ENABLE_RELEASE=1 ENABLE_ASSERTS=1 dmd

      - name: Link the default Windows system libraries
        shell: bash
        run: |
          CONF=dmd-src/generated/windows/release/64/sc.ini
          cat "$CONF"
          sed -i 's|^DFLAGS=%DFLAGS% -L/OPT:NOICF|DFLAGS=%DFLAGS% -L/OPT:NOICF -L/DEFAULTLIB:kernel32.lib -L/DEFAULTLIB:ntdll.lib -L/DEFAULTLIB:user32.lib|' "$CONF"
          cat "$CONF"
        # Officially-released dmd links fine against these without asking,
        # since cl.exe-compiled objects carry embedded #pragma comment(lib,...)
        # directives for them. Our from-source build's auto-generated sc.ini
        # has none, so druntime's own kernel32/ntdll/user32 calls (NtCurrentTeb,
        # RtlSetVolatileMemory, CharUpperW, etc) come back unresolved at link
        # time for every downstream package, not just sljit's own code.

      - name: Build druntime
        shell: bash
        run: |
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          make -j$(nproc) -C dmd-src/druntime MODEL=64 DMD="$DMD" CC=cl.exe
          cp dmd-src/druntime/src/__importc_builtins.di dmd-src/druntime/import/__importc_builtins.di
          cp dmd-src/druntime/src/__builtins_msvc.d dmd-src/druntime/import/__builtins_msvc.d

      - name: Checkout and build phobos
        shell: bash
        run: |
          git clone --depth 1 https://github.com/dlang/phobos.git phobos
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          make -j$(nproc) -C phobos MODEL=64 DMD="$DMD" CC=cl.exe DMD_DIR=../dmd-src

      - uses: actions/upload-artifact@v4
        with:
          name: dmd-Windows
          path: |
            dmd-src/generated
            dmd-src/druntime
            phobos

  sljit:
    needs: build-dmd
    runs-on: ubuntu-22.04
    continue-on-error: true # expected to fail on Linux until ImportC supports GNU inline asm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dmd-Linux, path: . }
      - run: chmod +x dmd-src/generated/linux/release/64/dmd
      - uses: dlang-community/setup-dlang@v1
      - name: Build and run the sljit zero-wrapper example
        working-directory: importc-sljit/examples/add
        run: dub build --compiler=$GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd && ./sljit-add-example
        # sljit_create_compiler unconditionally calls get_cpu_features(), which
        # hits GNU inline asm on Linux - ImportC turns that into a runtime
        # assert, so this fails here regardless of which sljit API is used.
        # Windows uses the MSVC intrinsics path instead and doesn't hit this,
        # see the sljit-windows job.

  sljit-windows:
    needs: build-dmd-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dmd-Windows, path: . }
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: dlang-community/setup-dlang@v1
      - name: Build and run the sljit zero-wrapper example
        shell: bash
        working-directory: importc-sljit/examples/add
        run: |
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          dub build --compiler="$DMD" --build=release
          ./sljit-add-example.exe
        # Debug builds don't inline aggressively, and __builtins_msvc.d's
        # MSVC intrinsics (__cpuidex, _xgetbv, _umul128, etc.) are marked
        # pragma(inline, true) with no fallback out-of-line symbol, so a
        # debug build leaves them as unresolved externals at link time.

      - name: Fetch sljit's own test suite
        shell: bash
        run: |
          mkdir -p sljit-test
          for f in sljitMain.c sljitTest.c sljitTestBuffers.h sljitTestCall.h sljitTestFloat.h sljitTestSerialize.h sljitTestSimd.h sljitConfigPre.h sljitConfigPost.h; do
            curl -sL "https://raw.githubusercontent.com/zherczeg/sljit/39c508d1/test_src/$f" -o "sljit-test/$f"
          done
        # Pinned to the same commit this package vendors (see README), so the
        # test suite matches the library it's actually testing.

      - name: Build and run sljit's own test suite, unmodified
        shell: bash
        run: |
          DMD=$(cygpath -w "$GITHUB_WORKSPACE/dmd-src/generated/windows/release/64/dmd.exe")
          "$DMD" -m64 -release -O -Iimportc-sljit/sljit_src -Isljit-test -ofsljit-test/sljit-test-suite.exe \
            importc-sljit/sljit_src/sljitLir.c sljit-test/sljitMain.c sljit-test/sljitTest.c
          ./sljit-test/sljit-test-suite.exe -s
        # Milestone 1: "confirm its own JIT test suite runs unmodified from D".
        # sljit_test() returns TEST_COUNT - successful_tests, so a 0 exit
        # code here means every one of its 138 tests genuinely passed.

  zlib:
    needs: build-dmd
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dmd-Linux, path: . }
      - run: chmod +x dmd-src/generated/linux/release/64/dmd
      - uses: dlang-community/setup-dlang@v1
      - name: Build and run the zlib zero-wrapper example
        working-directory: importc-zlib/examples/roundtrip
        run: dub build --compiler=$GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd && ./zlib-roundtrip-example

  curl:
    needs: build-dmd
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dmd-Linux, path: . }
      - run: chmod +x dmd-src/generated/linux/release/64/dmd
      - uses: dlang-community/setup-dlang@v1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev
      - name: Build and run the curl zero-wrapper example
        working-directory: importc-curl/examples/version_check
        run: dub build --compiler=$GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd && ./curl-version-example

  sdl:
    needs: build-dmd
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dmd-Linux, path: . }
      - run: chmod +x dmd-src/generated/linux/release/64/dmd
      - uses: dlang-community/setup-dlang@v1
      - name: Build SDL3 from source
        run: |
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL-build -DSDL_VIDEO=OFF -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/SDL-build -j$(nproc)
          mkdir -p importc-sdl/lib/linux-x64
          cp -P /tmp/SDL-build/libSDL3.so* importc-sdl/lib/linux-x64/
        # Built here instead of vendored in the repo: a prebuilt .so bakes in
        # the glibc of whatever machine compiled it (glibc 2.38 added
        # __isoc23_* versioned symbols for strtol/scanf C23 support), so a
        # binary built on a newer system fails to link on this older runner.
        # Building fresh against this runner's own glibc avoids that entirely.
      - name: Build and run the SDL3 zero-wrapper example
        working-directory: importc-sdl/examples/version_check
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/importc-sdl/lib/linux-x64
        run: dub build --compiler=$GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd && ./sdl-version-example

  sqlite:
    needs: build-dmd
    runs-on: ubuntu-22.04
    continue-on-error: true # expected to fail until Milestone 2 lands
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dmd-Linux, path: . }
      - run: chmod +x dmd-src/generated/linux/release/64/dmd
      - uses: dlang-community/setup-dlang@v1
      - name: Attempt to build sqlite (tracks Milestone 2 progress)
        working-directory: importc-sqlite
        run: $GITHUB_WORKSPACE/dmd-src/generated/linux/release/64/dmd -c -Isqlite_src sqlite_src/sqlite3.c
