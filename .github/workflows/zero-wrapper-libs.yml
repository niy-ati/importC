        # times under ImportC-generated code. That would be a genuinely
        # minimal, dmd-actionable repro.
        # Result: all 200 iterations passed clean, so generic JIT churn
        # alone isn't the trigger - it needs something more specific from
        # the real test content.

      - name: Reduce further - loop sljit_emit_const/sljit_set_const specifically
